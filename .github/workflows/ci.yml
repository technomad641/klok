name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest discover -s tests -t .

      - name: Byte-compile the package (catches syntax errors setup.py won't)
        run: python -m compileall -q klok

  install:
    name: Install and smoke-test the console script
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip install .
        run: pip install .

      - name: klok runs and tracks an entry end to end
        run: |
          set -euo pipefail
          export KLOK_HOME="$(mktemp -d)"
          klok --version
          klok start acme +ci --at 09:00
          klok stop --at 09:30
          klok log :day | grep -q "30m"
          klok breathe --list | grep -q box
          klok mindful :day || true
