<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="A terminal running klok: start a tagged entry, check status, stop it, and print the day's report.">
  <!-- window -->
  <rect width="680" height="330" rx="14" fill="#15151a"/>
  <rect width="680" height="40" rx="14" fill="#1f1f25"/>
  <rect y="26" width="680" height="14" fill="#1f1f25"/>
  <circle cx="26" cy="20" r="6" fill="#e06c5a"/>
  <circle cx="48" cy="20" r="6" fill="#e0b050"/>
  <circle cx="70" cy="20" r="6" fill="#5bb04f"/>
  <text x="340" y="25" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#8f8c82">klok &#8212; zsh</text>

  <!-- session -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <text x="24" y="76">
      <tspan fill="#7fc99a">$ </tspan><tspan fill="#ece9e2">klok start writing </tspan><tspan fill="#8aa6d6">+deep </tspan><tspan fill="#ece9e2">-n </tspan><tspan fill="#d9a066">"draft the intro"</tspan>
    </text>
    <text x="24" y="102"><tspan fill="#5bb89a">&#9654; </tspan><tspan fill="#a9a79d">started writing +deep at 09:14</tspan></text>

    <text x="24" y="134"><tspan fill="#7fc99a">$ </tspan><tspan fill="#ece9e2">klok status</tspan></text>
    <text x="24" y="160"><tspan fill="#a9a79d">writing </tspan><tspan fill="#8aa6d6">+deep</tspan><tspan fill="#a9a79d"> &#183; </tspan><tspan fill="#ece9e2">00:52:10</tspan><tspan fill="#a9a79d"> &#183; </tspan><tspan fill="#d9a066">"draft the intro"</tspan></text>

    <text x="24" y="192"><tspan fill="#7fc99a">$ </tspan><tspan fill="#ece9e2">klok stop</tspan></text>
    <text x="24" y="218"><tspan fill="#5bb89a">&#9632; </tspan><tspan fill="#a9a79d">stopped writing &#8212; 52m logged</tspan></text>

    <text x="24" y="250"><tspan fill="#7fc99a">$ </tspan><tspan fill="#ece9e2">klok report :today</tspan></text>
    <text x="24" y="276"><tspan fill="#ece9e2">writing </tspan><tspan fill="#ece9e2" font-weight="600">1h12m</tspan><tspan fill="#a9a79d">   acme </tspan><tspan fill="#ece9e2" font-weight="600">2h05m</tspan><tspan fill="#a9a79d">   email </tspan><tspan fill="#ece9e2" font-weight="600">22m</tspan></text>

    <text x="24" y="308"><tspan fill="#7fc99a">$ </tspan></text>
    <rect x="40" y="296" width="9" height="16" fill="#ece9e2">
      <animate attributeName="opacity" dur="1.1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;1" values="1;0;1"/>
    </rect>
  </g>
</svg>
