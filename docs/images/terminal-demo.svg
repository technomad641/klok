<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="An animated terminal running klok: start a tagged entry, check status, stop it, and print the day's report.">
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; }
    .prompt { fill: #7fc99a; }
    .cmd { fill: #ece9e2; }
    .tag { fill: #8aa6d6; }
    .str { fill: #d9a066; }
    .out { fill: #a9a79d; }
    .ok  { fill: #5bb89a; }
    .num { fill: #ece9e2; }
    .r1,.r2,.r3,.r4,.r5,.r6,.r7,.r8,.r9 { opacity: 0; }
    .r1 { animation: k1 15s infinite; }
    .r2 { animation: k2 15s infinite; }
    .r3 { animation: k3 15s infinite; }
    .r4 { animation: k4 15s infinite; }
    .r5 { animation: k5 15s infinite; }
    .r6 { animation: k6 15s infinite; }
    .r7 { animation: k7 15s infinite; }
    .r8 { animation: k8 15s infinite; }
    .r9 { animation: k9 15s infinite; }
    .caret { fill: #ece9e2; animation: blink 1.1s steps(1) infinite; }
    @keyframes k1 { 0%,1%{opacity:0} 3%,95%{opacity:1} 100%{opacity:0} }
    @keyframes k2 { 0%,9%{opacity:0} 11%,95%{opacity:1} 100%{opacity:0} }
    @keyframes k3 { 0%,18%{opacity:0} 20%,95%{opacity:1} 100%{opacity:0} }
    @keyframes k4 { 0%,26%{opacity:0} 28%,95%{opacity:1} 100%{opacity:0} }
    @keyframes k5 { 0%,36%{opacity:0} 38%,95%{opacity:1} 100%{opacity:0} }
    @keyframes k6 { 0%,44%{opacity:0} 46%,95%{opacity:1} 100%{opacity:0} }
    @keyframes k7 { 0%,54%{opacity:0} 56%,95%{opacity:1} 100%{opacity:0} }
    @keyframes k8 { 0%,62%{opacity:0} 64%,95%{opacity:1} 100%{opacity:0} }
    @keyframes k9 { 0%,72%{opacity:0} 74%,95%{opacity:1} 100%{opacity:0} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style>

  <rect width="680" height="330" rx="14" fill="#15151a"/>
  <!-- title bar -->
  <rect width="680" height="40" rx="14" fill="#1f1f25"/>
  <rect y="26" width="680" height="14" fill="#1f1f25"/>
  <circle cx="26" cy="20" r="6" fill="#e06c5a"/>
  <circle cx="48" cy="20" r="6" fill="#e0b050"/>
  <circle cx="70" cy="20" r="6" fill="#5bb04f"/>
  <text x="340" y="25" text-anchor="middle" class="mono" fill="#8f8c82" font-size="13">klok &#8212; zsh</text>

  <!-- body -->
  <text x="24" y="76"  class="mono r1"><tspan class="prompt">$ </tspan><tspan class="cmd">klok start writing </tspan><tspan class="tag">+deep </tspan><tspan class="cmd">-n </tspan><tspan class="str">"draft the intro"</tspan></text>
  <text x="24" y="102" class="mono r2"><tspan class="ok">&#9654; </tspan><tspan class="out">started writing +deep at 09:14</tspan></text>

  <text x="24" y="134" class="mono r3"><tspan class="prompt">$ </tspan><tspan class="cmd">klok status</tspan></text>
  <text x="24" y="160" class="mono r4"><tspan class="out">writing </tspan><tspan class="tag">+deep</tspan><tspan class="out"> &#183; </tspan><tspan class="num">00:52:10</tspan><tspan class="out"> &#183; </tspan><tspan class="str">"draft the intro"</tspan></text>

  <text x="24" y="192" class="mono r5"><tspan class="prompt">$ </tspan><tspan class="cmd">klok stop</tspan></text>
  <text x="24" y="218" class="mono r6"><tspan class="ok">&#9632; </tspan><tspan class="out">stopped writing &#8212; 52m logged</tspan></text>

  <text x="24" y="250" class="mono r7"><tspan class="prompt">$ </tspan><tspan class="cmd">klok report :today</tspan></text>
  <text x="24" y="276" class="mono r8"><tspan class="cmd">writing </tspan><tspan class="num">1h12m</tspan><tspan class="out">   acme </tspan><tspan class="num">2h05m</tspan><tspan class="out">   email </tspan><tspan class="num">22m</tspan></text>

  <g class="r9">
    <text x="24" y="308" class="mono"><tspan class="prompt">$ </tspan></text>
    <rect class="caret" x="40" y="296" width="9" height="16"/>
  </g>
</svg>
