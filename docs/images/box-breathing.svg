<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" role="img" aria-label="An animated box-breathing guide: a marker traces a square through inhale, hold, exhale and rest while a circle expands and contracts.">
  <defs>
    <radialGradient id="orbg" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#c6d4ef"/>
      <stop offset="68%" stop-color="#7b97d4"/>
      <stop offset="100%" stop-color="#5f7ec1"/>
    </radialGradient>
  </defs>

  <rect width="360" height="330" rx="18" fill="#15151a"/>

  <text x="180" y="40" text-anchor="middle" fill="#ece9e2" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600">box breathing</text>
  <text x="180" y="60" text-anchor="middle" fill="#8f8c82" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">4 &#183; 4 &#183; 4 &#183; 4</text>

  <!-- the square guide -->
  <rect x="110" y="90" width="140" height="140" rx="10" fill="none" stroke="#2f3550" stroke-width="2.5"/>

  <!-- edge labels -->
  <g fill="#8f8c82" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
    <text x="101" y="164" text-anchor="end">in</text>
    <text x="180" y="82"  text-anchor="middle">hold</text>
    <text x="259" y="164" text-anchor="start">out</text>
    <text x="180" y="250" text-anchor="middle">rest</text>
  </g>

  <!-- the breathing orb -->
  <g transform="translate(180 160)">
    <circle r="40" fill="url(#orbg)" opacity="0.92">
      <animateTransform attributeName="transform" type="scale" dur="16s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" values="0.62;1;1;0.62;0.62"
        keySplines="0.42 0 0.58 1 ; 0 0 1 1 ; 0.42 0 0.58 1 ; 0 0 1 1"/>
    </circle>
  </g>

  <!-- the travelling marker -->
  <circle r="7" fill="#8aa6d6" stroke="#15151a" stroke-width="2.5">
    <animate attributeName="cx" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.5;0.75;1" values="110;110;250;250;110"/>
    <animate attributeName="cy" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.5;0.75;1" values="230;90;90;230;230"/>
  </circle>

  <!-- the phase word -->
  <g text-anchor="middle" fill="#ece9e2" font-family="Georgia, 'Times New Roman', serif" font-size="21">
    <text x="180" y="300" opacity="0">Breathe in<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;1" values="1;0;0"/></text>
    <text x="180" y="300" opacity="0">Hold<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;1" values="0;1;0;0"/></text>
    <text x="180" y="300" opacity="0">Breathe out<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.75;1" values="0;1;0;0"/></text>
    <text x="180" y="300" opacity="0">Rest<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.75;1" values="0;1;0"/></text>
  </g>
</svg>
