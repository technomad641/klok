[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI distribution name is "klok-cli" because "klok" is already taken
# by an unrelated, empty placeholder package. The installed command is
# still plain `klok` - see [project.scripts] below.
name = "klok-cli"
version = "1.0.1"
description = "A batteries-included command-line time tracker with a plaintext backend."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rajat Singh" }]
keywords = ["time-tracking", "cli", "timesheet", "pomodoro", "productivity"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
klok = "klok.cli:main"

[project.urls]
Homepage = "https://github.com/technomad641/klok"
Repository = "https://github.com/technomad641/klok"
Issues = "https://github.com/technomad641/klok/issues"

[tool.setuptools.packages.find]
include = ["klok*"]
