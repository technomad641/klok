[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "klok"
version = "1.0.0"
description = "A batteries-included command-line time tracker with a plaintext backend."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["time-tracking", "cli", "timesheet", "pomodoro", "productivity"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
klok = "klok.cli:main"

[project.urls]
Homepage = "https://github.com/technomad641/awesome-cli-apps"

[tool.setuptools.packages.find]
include = ["klok*"]
